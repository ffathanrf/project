<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Snipster</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js"></script>
<style>
/* Layout: sticky top navbar + centered 1120px container; pages use a main column + sticky side summary that stacks under 900px; mobile gets the app's bottom tab bar */
:root{
  --brand:#0b3d86;
  --blue:#2563eb; --blue-deep:#1d4ed8; --indigo:#4338ca; --blue-soft:#eff6ff; --blue-line:#bfdbfe; --navy:#1e3a8a;
  --ink:#1f2937; --text:#111827; --muted:#6b7280; --faint:#9ca3af; --line:#e5e7eb; --soft:#f3f4f6; --mint:#eef6f3;
  --page:#f8fafc; --surface:#ffffff;
  --green:#16a34a; --green-bg:#dcfce7; --amber:#fbbf24; --amber-bg:#fef3c7; --amber-ink:#b45309; --orange:#d97706; --red:#dc2626;
  --f-ui:"Plus Jakarta Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-brand:"League Spartan","Plus Jakarta Sans",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--page);color:var(--text);font-family:var(--f-ui);font-size:14px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h1,h2,h3{text-wrap:balance}
.wrap{max-width:1152px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
main .wrap{padding-block:28px 64px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--surface)}
/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:28px;height:68px}
.logo{font-family:var(--f-brand);font-weight:800;font-size:28px;color:var(--brand);letter-spacing:.5px;line-height:1;padding-top:4px}
.links{display:flex;gap:4px;flex:1}
.links button{padding:9px 14px;border-radius:8px;font-weight:600;color:var(--muted);font-size:14px}
.links button:hover{color:var(--ink);background:var(--soft)}
.links button.on{color:var(--blue);background:var(--blue-soft)}
.tools{display:flex;align-items:center;gap:10px}
.points{display:flex;align-items:center;gap:6px;background:var(--amber-bg);color:var(--amber-ink);font-size:13px;padding:8px 14px;border-radius:999px;font-weight:700}
.iconbtn{position:relative;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink)}
.iconbtn:hover{background:var(--soft)}
.badge{position:absolute;top:2px;right:0;background:var(--red);color:#fff;font-size:10px;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px;font-weight:700}
.bookcta{background:#000;color:#fff;padding:10px 16px;border-radius:10px;font-weight:700;font-size:13px;display:flex;gap:8px;align-items:center}
.mnav{display:none}
@media (max-width:860px){
  .links,.bookcta,.points .lbl{display:none}
  .top .wrap{height:60px;justify-content:space-between}
  .logo{font-size:24px}
  .mnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);justify-content:space-around;align-items:flex-end;padding:8px max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .mnav button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:var(--faint);width:58px}
  .mnav button.on{color:var(--blue)}
  .mnav .fab{width:44px;height:44px;border-radius:50%;background:#000;color:#fff;display:grid;place-items:center;border:4px solid var(--line);margin-top:-28px}
  main .wrap{padding-bottom:110px}
}
/* page furniture */
.crumb{display:flex;align-items:center;gap:10px;margin-bottom:18px;color:var(--muted);font-size:13px}
.crumb button{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--ink)}
.crumb button:hover{color:var(--blue)}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.ph h1{margin:0;font-size:28px;font-weight:800;letter-spacing:-.02em}
.ph p{margin:6px 0 0;color:var(--muted)}
.sec{display:flex;flex-direction:column;gap:14px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.sec-h h2{margin:0;font-size:19px;font-weight:700;color:var(--ink)}
.link{color:var(--blue);font-size:13px;font-weight:600}
.stack{display:flex;flex-direction:column;gap:28px}
.two{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:28px;align-items:start}
.sticky{position:sticky;top:calc(88px + env(safe-area-inset-top,0px))}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
@media (max-width:980px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){.two{grid-template-columns:1fr}.sticky{position:static}}
@media (max-width:560px){.grid3{grid-template-columns:1fr}.grid2.st{grid-template-columns:1fr}.ph h1{font-size:23px}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.card.flat{border:0;box-shadow:0 1px 2px rgba(16,24,40,.04),0 4px 16px rgba(16,24,40,.06)}
.muted{color:var(--muted)}.small{font-size:12.5px}.xs{font-size:11px}
.row{display:flex;align-items:center;gap:12px}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--ink);color:#fff;border-radius:12px;padding:13px 20px;font-weight:700;font-size:14px}
.btn:hover{background:#111827}
.btn.full{width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.light{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.light:hover{border-color:var(--ink)}
.btn.blue{background:var(--blue)}.btn.blue:hover{background:var(--blue-deep)}
.btn.sm{padding:8px 14px;font-size:12px;border-radius:8px}
.chip{padding:8px 16px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:13px;color:var(--muted);white-space:nowrap;font-weight:600}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.06em;padding:4px 9px;border-radius:999px}
.av{border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;flex:none}
.star{color:var(--amber)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:22px}
.tabs button{padding:12px 18px;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;font-weight:700;margin-bottom:-1px}
.tabs button.on{color:var(--blue);border-color:var(--blue)}
.seg{display:flex;background:var(--mint);border-radius:12px;padding:5px;max-width:420px}
.seg button{flex:1;padding:11px;border-radius:9px;font-size:13px;color:var(--muted);font-weight:700}
.seg button.on{background:#fff;color:var(--blue);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.lbl-up{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:800}
.opt{display:flex;align-items:center;gap:14px;border:1px solid var(--line);border-radius:12px;padding:15px 16px;width:100%;text-align:left;background:#fff;transition:border-color .15s}
.opt:hover{border-color:var(--blue-line)}
.opt.on{border-color:var(--blue);background:var(--blue-soft)}
.radio{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.opt.on .radio{border-color:var(--blue)}
.opt.on .radio::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--blue)}
.check{width:19px;height:19px;border-radius:5px;border:2px solid var(--line);flex:none;display:grid;place-items:center;color:#fff;font-size:10px;background:#fff}
.check.on{background:var(--navy);border-color:var(--navy)}
.price{color:var(--blue);font-weight:700}
.num{font-variant-numeric:tabular-nums}
.toggle{width:42px;height:24px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .2s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.toggle.on{background:var(--blue)}.toggle.on::after{left:21px}
.toast{position:fixed;left:50%;bottom:calc(32px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13px;padding:12px 20px;border-radius:999px;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:calc(100% - 32px);text-align:center}
@media (max-width:860px){.toast{bottom:calc(90px + env(safe-area-inset-bottom,0px))}}
.sum-line{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;padding:5px 0}
.sum-line.total{border-top:1px dashed var(--line);margin-top:8px;padding-top:12px;font-weight:800;font-size:15px}
.success{max-width:480px;margin:24px auto 0;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.success .ok{width:96px;height:96px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:38px;margin-bottom:8px;animation:pop .45s ease-out}
.success h1{margin:0;font-size:26px}
.success p{margin:0;max-width:340px;line-height:1.55}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.dl{width:100%;display:flex;flex-direction:column;gap:12px;margin:18px 0 6px;text-align:left}
.dl div{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.dl dt{color:var(--muted)}.dl dd{margin:0;font-weight:700;text-align:right}
/* home */
.hero{background:linear-gradient(105deg,var(--blue),var(--indigo));color:#fff;border-radius:20px;padding:36px 40px;position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center;box-shadow:0 18px 30px -12px rgba(37,99,235,.45)}
.hero .eyebrow{font-size:12px;letter-spacing:.12em;opacity:.8;font-weight:700}
.hero h1{margin:8px 0 10px;font-size:34px;line-height:1.1;font-weight:800;letter-spacing:-.02em}
.hero h1 u{text-underline-offset:6px;text-decoration-thickness:3px}
.hero p{margin:0 0 22px;opacity:.9;max-width:460px;line-height:1.55;font-size:15px}
.hero .cta{background:#fff;color:var(--blue-deep);font-size:14px;padding:12px 20px;border-radius:10px;font-weight:700}
.hero .ghost{color:#fff;font-size:14px;padding:12px 16px;font-weight:600;opacity:.9}
.hero .bot{position:absolute;right:-20px;bottom:-40px;font-size:200px;opacity:.12}
.hero .faces{display:flex;gap:12px;position:relative}
.hero .face{width:110px;border-radius:14px;background:rgba(255,255,255,.14);padding:10px;text-align:center;backdrop-filter:blur(2px)}
.hero .face .art{background:rgba(255,255,255,.85);border-radius:10px;overflow:hidden;display:grid;place-items:end center;height:96px}
.hero .face b{display:block;font-size:12px;margin-top:8px}
.hero .face span{font-size:11px;color:#bbf7d0;font-weight:700}
@media (max-width:860px){.hero{grid-template-columns:1fr;padding:26px 22px}.hero h1{font-size:26px}.hero .faces{display:none}}
.greet{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}
.greet h1{margin:0;font-size:24px;font-weight:800}
.tile{display:flex;align-items:center;gap:14px;padding:18px;text-align:left;border-radius:14px;border:1px solid var(--line);background:#fff;transition:border-color .15s,transform .15s}
.tile:hover{border-color:var(--blue-line);transform:translateY(-1px)}
.tile .ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex:none}
.tile b{display:block;font-size:14px}
.bcard{display:flex;flex-direction:column;gap:14px}
.bcard .top-r{display:flex;gap:14px;align-items:center}
.mbadge{background:var(--green-bg);color:var(--green);font-size:11px;font-weight:800;padding:5px 10px;border-radius:999px;white-space:nowrap}
.prod{display:flex;flex-direction:column;gap:8px;text-align:left;min-width:0}
.prod .art{aspect-ratio:1/1;max-width:100%;border-radius:14px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;transition:border-color .15s}
.prod:hover .art{border-color:var(--blue-line)}
.addbtn{width:32px;height:32px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:12px;flex:none}
.addbtn:hover{background:var(--blue)}
/* scan */
.scan-box{border-radius:22px;background:#fff;border:1px solid var(--line);aspect-ratio:4/3;max-width:100%;display:grid;place-items:center;position:relative;overflow:hidden}
.ring{width:min(260px,60vw);aspect-ratio:1;border-radius:50%;border:2px dashed #374151;position:relative;display:grid;place-items:center;color:var(--faint);overflow:hidden;background-size:cover;background-position:center}
.scanning .ring{border-style:solid;border-color:var(--blue)}
.beam{position:absolute;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--blue),transparent);top:10%;animation:beam 1.2s ease-in-out infinite alternate;z-index:2}
@keyframes beam{to{top:88%}}
.bar{height:6px;border-radius:999px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);transition:width .1s linear}
.result{background:var(--ink);color:#fff;border-radius:16px;padding:24px}
.result b{display:block;font-size:30px;margin:6px 0;letter-spacing:.02em}
.style{border-radius:14px;overflow:hidden;border:2px solid transparent;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.08);text-align:left;transition:border-color .15s}
.style.on{border-color:var(--blue)}
.style .art{aspect-ratio:5/4;max-width:100%;display:grid;place-items:end center;background:#e9edf3}
.style .t{padding:10px 12px}
.match{color:var(--green);font-size:12px;font-weight:800}
/* booking */
.dates{display:flex;gap:10px;flex-wrap:wrap}
.date{width:64px;border:1px solid var(--line);border-radius:12px;padding:10px 0;display:flex;flex-direction:column;align-items:center;gap:2px;background:#fff}
.date small{font-size:10px;color:var(--muted);font-weight:700}
.date b{font-size:20px}
.date.on{background:var(--navy);border-color:var(--navy);color:#fff}.date.on small{color:#c7d2fe}
.times{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.time{border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13.5px;background:#fff;font-weight:600}
.time.on{background:var(--blue-soft);border-color:var(--blue);color:var(--blue-deep)}
.time:disabled{opacity:.35;text-decoration:line-through;cursor:not-allowed}
/* tracking */
.map{position:relative;min-height:440px;background:#e5e7eb;overflow:hidden;border-radius:16px}
.map .rd{position:absolute;background:#fff}
.pin{position:absolute;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:17px;transform:translate(-50%,-50%);box-shadow:0 3px 8px rgba(0,0,0,.2);transition:left 1s,top 1s}
.eta{width:76px;height:76px;border-radius:50%;border:3px solid var(--blue);display:grid;place-items:center;text-align:center;line-height:1;flex:none}
.eta b{font-size:26px}
.chat{background:#eef3f3;height:330px;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:80%;font-size:13px;padding:10px 13px;border-radius:12px;line-height:1.45}
.msg small{display:block;text-align:right;font-size:10px;opacity:.6;margin-top:2px}
.msg.me{align-self:flex-end;background:var(--navy);color:#fff;border-bottom-right-radius:4px}
.msg.them{align-self:flex-start;background:#fff;border-bottom-left-radius:4px}
.compose{display:flex;gap:10px;align-items:center;padding:12px}
.compose input{flex:1;border:0;background:var(--soft);border-radius:999px;padding:12px 16px;font:inherit;font-size:13px;min-width:0}
/* reviews */
.rsum{display:flex;gap:20px;align-items:center}
.rsum .big{font-size:46px;font-weight:800;line-height:1}
.dist{flex:1;display:flex;flex-direction:column;gap:5px}
.dist div{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted)}
.dist span.b{flex:1;height:6px;border-radius:6px;background:var(--soft);overflow:hidden}
.dist span.b i{display:block;height:100%;background:var(--orange)}
.rev{display:flex;flex-direction:column;gap:8px}
.tag{align-self:flex-start;background:var(--soft);font-size:11px;padding:3px 9px;border-radius:5px;color:var(--muted)}
.stars-in{display:flex;gap:8px;justify-content:center;font-size:36px}
.stars-in button{color:#d1d5db;transition:transform .1s}.stars-in button:hover{transform:scale(1.1)}.stars-in button.on{color:var(--amber)}
textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:14px;font:inherit;font-size:14px;resize:vertical;min-height:120px}
.add-photo{width:96px;height:96px;border:1.5px dashed var(--blue);border-radius:12px;background:var(--blue-soft) center/cover;color:var(--blue);display:grid;place-items:center;font-size:12px;text-align:center;cursor:pointer}
/* shop */
.search{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:12px 18px;flex:1;max-width:420px}
.search input{border:0;background:none;font:inherit;font-size:14px;flex:1;min-width:0;outline:none}
.promo{border-radius:18px;background:linear-gradient(120deg,#1f3b3a,#2f5755);color:#f4d58d;padding:28px 32px;display:flex;justify-content:space-between;align-items:center;gap:16px;overflow:hidden}
.promo b{font-family:Georgia,"Times New Roman",serif;font-size:32px;line-height:1.05;font-weight:400}
.promo .off{background:#f4d58d;color:#1f3b3a;border-radius:50%;width:92px;height:92px;display:grid;place-items:center;text-align:center;font-weight:800;font-size:24px;line-height:1;flex:none}
.qty{display:inline-flex;align-items:center;gap:12px;background:var(--soft);border-radius:8px;padding:5px 10px;font-size:13px}
.qty button{width:20px;font-weight:700}
.pimg{aspect-ratio:1/1;max-width:100%;background:linear-gradient(#f3f4f6,#fff);border:1px solid var(--line);border-radius:20px;display:grid;place-items:center}
.qr{width:220px;height:220px;margin:0 auto;padding:12px;background:#fff;border:1px solid var(--line);border-radius:12px;max-width:100%}
.steps{display:flex;flex-direction:column;gap:12px}
.steps div{display:flex;gap:10px;font-size:13.5px;align-items:flex-start}
.steps b{width:22px;height:22px;border-radius:50%;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;font-size:11px;flex:none}
/* profile */
.prof{background:var(--ink);color:#fff;border-radius:18px;padding:30px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.gold{background:var(--amber);color:#3b2a00;font-size:10px;font-weight:800;letter-spacing:.06em;padding:4px 12px;border-radius:999px;margin-top:8px}
.menu{display:flex;flex-direction:column}
.menu button{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid var(--line);font-size:14px;font-weight:600;text-align:left}
.menu button:hover{color:var(--blue)}
.menu button:last-child{border-bottom:0}
.loy{background:var(--blue);color:#fff;border-radius:18px;padding:28px;text-align:center}
.loy b{display:block;font-size:44px;margin:4px 0 10px}
.loy span{background:rgba(255,255,255,.2);font-size:12px;padding:5px 12px;border-radius:999px}
.rw{display:flex;flex-direction:column;gap:14px;justify-content:space-between}
.rw .ic{width:44px;height:44px;border-radius:12px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;font-size:18px}

/* ---------- art ---------- */
function av(b,size=48){b=BARBERS[b]||b;const ini=b.name.split(' ').map(w=>w[0]).join('');return `<div class="av" style="width:${size}px;height:${size}px;background:${b.color};font-size:${size*.34}px">${ini}</div>`}
function userAv(size,name,color){const ini=name.replace(/[^A-Za-z ]/g,'').split(' ').map(w=>w[0]).join('').slice(0,2);return `<div class="av" style="width:${size}px;height:${size}px;background:${color};font-size:${size*.36}px">${ini}</div>`}
function prodArt(id,s=1){
  const w=80*s,h=80*s;
  if(id==='pomade')return `<svg width="${w}" height="${h}" viewBox="0 0 80 80" aria-hidden="true"><ellipse cx="40" cy="58" rx="30" ry="9" fill="#111"/><rect x="10" y="38" width="60" height="20" fill="#1a1a1a"/><ellipse cx="40" cy="38" rx="30" ry="9" fill="#2b2b2b"/><ellipse cx="40" cy="38" rx="22" ry="5.5" fill="#3a3a3a"/><text x="40" y="51" font-size="7" text-anchor="middle" fill="#e7d8a6" font-family="sans-serif" font-weight="700">POMADE</text></svg>`;
  if(id==='oil')return `<svg width="${w}" height="${h}" viewBox="0 0 80 80" aria-hidden="true"><rect x="34" y="4" width="12" height="12" rx="2" fill="#222"/><rect x="31" y="15" width="18" height="6" fill="#333"/><rect x="26" y="21" width="28" height="55" rx="5" fill="#2e2a20"/><rect x="29" y="34" width="22" height="26" rx="2" fill="#d9d2bd"/><rect x="33" y="40" width="14" height="2" fill="#6b5f43"/><rect x="33" y="45" width="10" height="2" fill="#6b5f43"/></svg>`;

  return `<svg width="${w}" height="${h}" viewBox="0 0 80 80" aria-hidden="true"><ellipse cx="40" cy="58" rx="28" ry="9" fill="#0b1220"/><rect x="12" y="38" width="56" height="20" fill="#111827"/><ellipse cx="40" cy="38" rx="28" ry="9" fill="#1e293b"/><circle cx="40" cy="38" r="7" fill="#38bdf8" opacity=".8"/><text x="40" y="52" font-size="7" text-anchor="middle" fill="#7dd3fc" font-family="sans-serif" font-weight="700">HAIR CLAY</text></svg>`;

function hairArt(kind,h=110){

}
function stars(n,size=11){let s='';for(let i=1;i<=5;i++)s+=`<i class="fa-${i<=n?'solid':'regular'} fa-star"></i>`;return `<span class="star" style="font-size:${size}px;display:inline-flex;gap:2px">${s}</span>`}

const cartCount=()=>Object.values(S.cart).reduce((a,c)=>a+c.qty,0);

/* ---------- money ---------- */

  const b=S.bk,L=[];

  return L;
}
/* membership: level from total transactions (booking + products) in the last 12 months; 1 poin = Rp1 */
const TIERS=[
  {id:'silver',name:'Silver',min:0,max:400000,rate:.01,prod:0,homeTxt:'Normal',resched:1,window:7,birthday:'–',prio:'–',fg:'#475569',bg:'#e2e8f0',grad:'linear-gradient(120deg,#94a3b8,#cbd5e1)'},
  {id:'gold',name:'Gold',min:400000,max:1200000,rate:.02,prod:.03,homeTxt:'Diskon Rp5.000',resched:2,window:14,birthday:'Free Hair Wash',prio:'–',fg:'#92400e',bg:'#fef3c7',grad:'linear-gradient(120deg,#d97706,#fbbf24)'},
  {id:'platinum',name:'Platinum',min:1200000,max:Infinity,rate:.03,prod:.05,homeTxt:'Diskon 50% (maks. 1x/bulan)',resched:3,window:30,birthday:'Free Hair Wash + Beard Trim',prio:'VIP Priority Booking',fg:'#1e293b',bg:'#e2e8f0',grad:'linear-gradient(120deg,#1e293b,#64748b)'}
];
const tier=(spend=S.spend)=>TIERS.find(t=>spend<t.max);
const nextTier=()=>TIERS[TIERS.indexOf(tier())+1];
const pts=n=>n.toLocaleString('id-ID');
const pct=r=>Math.round(r*100)+'%';
const tierBadge=(t=tier())=>`<span class="pill" style="background:${t.bg};color:${t.fg}">${t.name.toUpperCase()} MEMBER</span>`;
const serviceBase=()=>bookingLines().filter(l=>l[0]!=='Home Service Fee').reduce((a,l)=>a+l[1],0);
const svcFee=()=>Math.round(serviceBase()*0.02);
function homeDisc(){if(S.bk.mode!=='home'||S.bk.source==='ai')return 0;const t=tier();if(t.id==='gold')return 5000;if(t.id==='platinum'&&!S.homeUsed)return 7500;return 0}
const grossBooking=()=>bookingLines().reduce((a,l)=>a+l[1],0)+svcFee()-homeDisc();
const ptsUse=()=>S.bk.usePoints?Math.min(S.points,grossBooking()):0;
const ptsOn=()=>ptsUse()>0;
const bookingTotal=()=>grossBooking()-ptsUse();
const earnBooking=()=>Math.round(serviceBase()*tier().rate);
function cartTotals(){let sub=0;for(const[id,c]of Object.entries(S.cart))if(c.on)sub+=PRODUCTS[id].price*c.qty;const ongkir=sub?15000:0,fee=Math.round(sub*0.02),disc=Math.round(sub*tier().prod);return{sub,ongkir,fee,disc,total:sub+ongkir+fee-disc}}
function addSpend(n){const before=tier();S.spend+=n;const after=tier();if(after!==before)setTimeout(()=>toast('Selamat! Kamu naik ke level '+after.name+' 🎉'),400)}

function bookingSummary(btnLabel,act,disabled){
  const L=bookingLines();
  return `<div class="card flat sticky sec"><div class="lbl-up">Ringkasan Pesanan</div><div>
   ${L.map(l=>`<div class="sum-line"><span class="muted">${l[0]}</span><b class="num">${rp(l[1])}</b></div>`).join('')}

   ${homeDisc()?`<div class="sum-line"><span class="muted">Diskon Home Service (${tier().name})</span><b class="num" style="color:var(--green)">${rp(-homeDisc())}</b></div>`:''}
   ${ptsOn()?`<div class="sum-line"><span class="muted">Pakai Poin</span><b class="num" style="color:var(--green)">${rp(-ptsUse())}</b></div>`:''}
   <div class="sum-line total"><span>Total Bayar</span><span class="price num">${rp(bookingTotal())}</span></div></div>
   <div class="row small" style="background:var(--amber-bg);color:var(--amber-ink);border-radius:10px;padding:10px 12px;gap:8px"><i class="fa-solid fa-coins"></i><span>Kamu dapat <b class="num">+${pts(earnBooking())} poin</b> (${tier().name} ${pct(tier().rate)} dari biaya potong)</span></div>
   ${act?`<button class="btn full" data-act="${act}" ${disabled?'disabled':''}>${btnLabel}</button>`:''}</div>`;
}

function qrSvg(){let s='';let seed=7;const r=()=>{seed=(seed*9301+49297)%233280;return seed/233280};const n=25,c=7;for(let y=0;y<n;y++)for(let x=0;x<n;x++){const inF=(x<8&&y<8)||(x>16&&y<8)||(x<8&&y>16);if(!inF&&r()>.5)s+=`<rect x="${x*c}" y="${y*c}" width="${c}" height="${c}"/>`}
 const f=(x,y)=>`<rect x="${x+3.5}" y="${y+3.5}" width="42" height="42" fill="none" stroke="#111" stroke-width="7"/><rect x="${x+14}" y="${y+14}" width="21" height="21"/>`;
 return `<svg viewBox="0 0 175 175" width="100%" height="100%" fill="#111" aria-label="Kode QRIS">${s}${f(0,0)}${f(119,0)}${f(0,119)}</svg>`}

/* ---------- shell ---------- */
const page=document.getElementById('page');
function shell(){
  const on=NAVMAP[S.screen]||'home';
  const L=[['home','Beranda','fa-house'],['book','Booking','fa-calendar-plus'],['toko','Toko','fa-store'],['pesanan','Pesanan','fa-calendar-days'],['member','Membership','fa-crown']];
  document.getElementById('links').innerHTML=L.map(l=>`<button class="${on===l[0]?'on':''}" data-nav="${l[0]}">${l[1]}</button>`).join('');
  document.getElementById('tools').innerHTML=`<button class="points" data-go="loyalty"><i class="fa-solid fa-coins"></i><span class="num">${pts(S.points)}</span><span class="lbl">Poin</span></button><button class="iconbtn" data-go="keranjang" aria-label="Keranjang"><i class="fa-solid fa-cart-shopping"></i>${cartCount()?`<span class="badge">${cartCount()}</span>`:''}</button><button class="iconbtn" data-nav="profil" aria-label="Profil" style="${on==='profil'?'background:var(--blue-soft)':''}"><span class="av" style="width:34px;height:34px;background:#7a4b2e;font-size:12px">BP</span></button><button class="bookcta" data-act="bookCabang"><i class="fa-solid fa-plus"></i> Book Sekarang</button>`;
  const it=(k,ic,l)=>`<button class="${on===k?'on':''}" data-nav="${k}"><i class="fa-solid ${ic}"></i>${l}</button>`;
  document.getElementById('mnav').innerHTML=`${it('home','fa-house','Home')}${it('pesanan','fa-calendar-days','Pesanan')}<button class="${on==='book'?'on':''}" data-act="bookCabang"><span class="fab"><i class="fa-solid fa-plus"></i></span>Book</button>${it('toko','fa-store','Toko')}${it('profil','fa-user','Profil')}`;
}
function render(keep){const y=window.scrollY;page.innerHTML=V[S.screen]();shell();if(!keep)window.scrollTo(0,0);else window.scrollTo(0,y);after()}
function go(s,push=true){clearTimers();if(s!=='scan')stopCam();S.camError=false;if(s==='scan'&&S.screen!=='scan')S.camTried=false;if(push&&S.screen!==s)S.hist.push(S.screen);S.screen=s;S.scanning=false;render()}
function back(){clearTimers();stopCam();S.screen=S.hist.pop()||'home';S.scanning=false;render()}
function toast(m){document.querySelectorAll('.toast').forEach(t=>t.remove());const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2400)}
const readImg=(input,cb)=>input.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>cb(r.result);r.readAsDataURL(f)};

function after(){
  if(S.screen==='tracking'||S.screen==='chat'){
    timers.push(setInterval(()=>{if(S.eta>0){S.eta--;const v=document.getElementById('chatin').value;render(true);document.getElementById('chatin').value=v}},5000));
    const log=document.getElementById('chatlog');log.scrollTop=log.scrollHeight;
    if(S.screen==='chat'){document.getElementById('chatcard').scrollIntoView({block:'center'});document.getElementById('chatin').focus({preventScroll:true})}
    document.getElementById('chatform').onsubmit=e=>{e.preventDefault();const v=document.getElementById('chatin').value.trim();if(!v)return;const d=new Date();const at=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');S.chat.push({me:true,t:v,at});rerenderChat();
      timers.push(setTimeout(()=>{S.chat.push({me:false,t:['Siap mas, dicatat ya 👍','Oke mas, sebentar lagi saya sampai.','Baik mas, terima kasih infonya.'][S.chat.length%3],at});rerenderChat()},1400))};
  }
  if(S.screen==='qris'){let s=899;timers.push(setInterval(()=>{s--;const el=document.getElementById('cd');if(el)el.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},1000))}
  if(S.screen==='tulis'){const ta=document.getElementById('revtext');ta.oninput=()=>{S.review=ta.value;document.getElementById('revcount').textContent=ta.value.length+'/500'};readImg(document.getElementById('revphoto'),d=>{S.photo=d;render(true)})}
  if(S.screen==='scan'&&!S.camTried&&!S.stream&&!S.scanPhoto&&!S.scanning){S.camTried=true;ACT.camOn()}
  if(S.screen==='scan'){readImg(document.getElementById('scanfile'),d=>{stopCam();S.scanPhoto=d;S.camError=false;render(true)});const v=document.getElementById('camvideo');if(v&&S.stream){v.srcObject=S.stream;v.play&&v.play().catch(()=>{})}}
  if(S.screen==='toko'){const i=document.getElementById('search');i.oninput=()=>{S.search=i.value;const pos=i.selectionStart;render(true);const n=document.getElementById('search');n.focus();n.setSelectionRange(pos,pos)}}
  if(S.screen==='ulasanProduk')document.getElementById('reviews').scrollIntoView();
}
function rerenderChat(){const log=document.getElementById('chatlog');if(!log)return;log.innerHTML=`<div class="xs muted" style="text-align:center;font-weight:800;letter-spacing:.06em">HARI INI, 10:45</div>`+S.chat.map(m=>`<div class="msg ${m.me?'me':'them'}">${esc(m.t)}<small>${m.at}</small></div>`).join('');log.scrollTop=log.scrollHeight;const i=document.getElementById('chatin');if(i&&S.chat[S.chat.length-1].me)i.value=''}

const ACT={
  pickBarber:id=>{S.barber=id;S.bk.source='ai';go('jadwal')},
  bookHome:()=>{S.bk.mode='home';S.bk.source='book';S.hist=['home'];go('book',false)},
  bookCabang:()=>{S.bk.mode='cabang';S.bk.source='book';S.hist=[];go('book',false)},
  openProduct:id=>{S.product=id;go('produk')},
  toReviews:()=>document.getElementById('reviews').scrollIntoView({behavior:'smooth'}),
  camOn:async()=>{S.camError=false;try{if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('no camera');S.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});S.scanPhoto=null}catch(e){S.camError=true}render(true)},
  camOff:()=>{stopCam();render(true)},
  toPacks:()=>{const el=document.getElementById('scanpacks');el.scrollIntoView({behavior:'smooth',block:'center'});el.animate&&el.animate([{boxShadow:'0 0 0 4px rgba(37,99,235,.35)'},{boxShadow:'0 0 0 0 rgba(37,99,235,0)'}],{duration:1200})},
  openPacks:()=>{go('scan');setTimeout(()=>ACT.toPacks(),50)},
  buy:(id,el)=>{const k={type:el.dataset.type,qty:+el.dataset.qty,price:+el.dataset.price};S.purchase=k;S.payP=k.type==='scan'&&S.points>=k.price?'poin':'qris';go('beli')},
  payP:id=>{S.payP=id;render(true)},
  payPurchase:()=>{const k=S.purchase;k.paidWith=S.payP;if(S.payP==='poin'){if(S.points<k.price)return;S.points-=k.price;S.ptlog=[['Bayar paket '+k.qty+'x scan',-k.price]].concat(S.ptlog)}
    if(k.type==='scan')S.scanCredits+=k.qty;else{S.points+=k.qty;S.ptlog=[['Beli '+pts(k.qty)+' poin',k.qty]].concat(S.ptlog)}S.hist=['home'];go('beliSukses',false)},
  startScan:()=>{if(scanLeft()<=0){toast('Kuota scan habis. Beli paket untuk lanjut.');ACT.toPacks();return}
    if(S.stream){const v=document.getElementById('camvideo');if(v&&v.videoWidth){const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;const x=c.getContext('2d');x.translate(c.width,0);x.scale(-1,1);x.drawImage(v,0,0);S.scanPhoto=c.toDataURL('image/jpeg',.85)}stopCam()}
    if(S.scanFree>0)S.scanFree--;else S.scanCredits--;
    S.scanning=true;render(true);let p=0;timers.push(setInterval(()=>{p+=3;const b=document.getElementById('scanbar');if(b)b.style.width=p+'%';if(p>=100){clearTimers();S.scanning=false;go('hasil')}},80))},
  pickStyle:id=>{S.style=id;render(true)},
  selBarber:id=>{S.barber=id;render(true)},
  toJadwal:()=>{S.bk.source='ai';go('jadwal')},
  aiDate:id=>{S.aiDate=id;render(true)},aiTime:id=>{S.aiTime=id;render(true)},
  aiPay:()=>{S.bk.source='ai';S.bk.mode='cabang';go('bayar')},
  mode:id=>{S.bk.mode=id;S.bk.source='book';render(true)},
  svc:id=>{S.bk.svc=id;render(true)},date:id=>{S.bk.date=id;render(true)},time:id=>{S.bk.time=id;render(true)},
  homeSvc:id=>{S.bk.home[id]=!S.bk.home[id];render(true)},
  toPay:()=>go('bayar'),
  usePts:()=>{S.bk.usePoints=!S.bk.usePoints;render(true)},
  bkPay:id=>{S.bk.pay=id;render(true)},
  payBooking:()=>{const b=S.bk,used=ptsUse(),earned=earnBooking(),hd=homeDisc(),base=serviceBase()+(b.mode==='home'&&b.source!=='ai'?15000:0);
    let k;if(b.source==='ai'){const B=BARBERS[S.barber];k={barber:B.name.split(' ')[0]+' '+B.nick,date:S.aiDate.replace('Jun','Juni')+' 2026',time:S.aiTime,svc:S.style,home:false}}
    else if(b.mode==='cabang')k={barber:'Andi The Fade Master',date:b.date+' Okt 2026',time:b.time,svc:b.svc==='tfw'?'Textured Fade & Wash':'Classic Haircut',home:false};
    else k={barber:'Rian "The Specialist"',date:'Hari ini',time:'± 25 menit lagi',svc:bookingLines().filter(l=>l[0]!=='Home Service Fee').map(l=>l[0]).join(' + '),home:true};
    S.points=S.points-used+earned;if(hd&&tier().id==='platinum')S.homeUsed=true;S.bk.usePoints=false;
    S.ptlog=[[(b.source==='ai'?'Booking '+S.style:'Booking '+k.svc),earned]].concat(used?[['Pakai poin saat bayar',-used]]:[]).concat(S.ptlog);addSpend(base);
    k.earned=earned;S.lastBooking=k;S.upcoming.unshift(k);S.hist=['home'];go('sukses',false)},
  goHome:()=>{S.hist=[];go('home',false)},
  seeOrders:()=>{S.tab='berjalan';S.hist=[];go('pesanan',false)},
  tab:id=>{S.tab=id;render(true)},
  rateAndi:()=>{S.reviewBarber='andi';S.stars=4;S.review='';S.photo=null;go('tulis')},
  cab:id=>{S.cabangFilter=id;render(true)},
  shopCat:id=>{S.shopCat=id;render(true)},
  openReviews:id=>{S.reviewBarber=id;go('ulasanBarber')},
  writeReview:id=>{S.reviewBarber=id;S.stars=4;S.review='';S.photo=null;go('tulis')},
  star:id=>{S.stars=+id;render(true)},
  sendReview:()=>{S.points+=500;S.ptlog=[['Ulasan barber',500]].concat(S.ptlog);S.hist=['home'];go('terkirim',false)},
  addCart:id=>{if(S.cart[id]){S.cart[id].qty++;S.cart[id].on=true}else S.cart[id]={qty:1,on:true};toast(PRODUCTS[id].name+' masuk keranjang');render(true)},
  buyNow:id=>{Object.values(S.cart).forEach(c=>c.on=false);if(S.cart[id])S.cart[id].on=true;else S.cart[id]={qty:1,on:true};go('checkout')},
  psize:id=>{S.psize=id;render(true)},
  cartAll:()=>{const all=Object.values(S.cart).every(c=>c.on);Object.values(S.cart).forEach(c=>c.on=!all);render(true)},
  cartTog:id=>{S.cart[id].on=!S.cart[id].on;render(true)},
  cartDel:()=>{const sel=Object.keys(S.cart).filter(id=>S.cart[id].on);if(!sel.length){toast('Pilih produk yang mau dihapus');return}sel.forEach(id=>delete S.cart[id]);toast(sel.length+' produk dihapus');render(true)},
  cartRm:id=>{delete S.cart[id];render(true)},
  qty:(id,el)=>{const c=S.cart[id];c.qty=Math.max(1,c.qty+ +el.dataset.d);render(true)},
  shipPay:id=>{S.shipPay=id;render(true)},
  payShop:()=>{const t=cartTotals();const sel=Object.entries(S.cart).filter(([,c])=>c.on);S.lastOrder={id:'#SNP-'+(998210+Math.floor(Math.random()*700)),items:sel.map(([id])=>PRODUCTS[id].name).join(', '),total:t.total,sub:t.sub};if(S.shipPay==='qris')go('qris');else ACT.qrisDone()},
  qrisDone:()=>{Object.keys(S.cart).filter(id=>S.cart[id].on).forEach(id=>delete S.cart[id]);addSpend((S.lastOrder||{}).sub||0);S.hist=['toko'];go('suksesProduk',false)},
  trackOrder:()=>{S.tab='riwayat';S.hist=[];go('pesanan',false)},
  resched:()=>{const left=tier().resched-S.reschedUsed;if(left<=0){toast('Kuota reschedule gratis bulan ini sudah habis');return}S.reschedUsed++;toast('Jadwal bisa diubah. Sisa reschedule gratis: '+(left-1)+'x');render(true)},
  toast:(id,el)=>toast(el.dataset.msg)
};

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-go],[data-act],[data-back],[data-nav]');if(!el||el.disabled)return;
  if(el.hasAttribute('data-back'))return back();
  if(el.dataset.nav){S.hist=[];if(el.dataset.nav==='book'){S.bk.source='book'}return go(el.dataset.nav,false)}
  if(el.dataset.go)return go(el.dataset.go);
  const f=ACT[el.dataset.act];if(f)f(el.dataset.id,el);
});
document.getElementById('reset').onclick=()=>{clearTimers();S=initial();render();toast('Demo dikembalikan ke awal')};
const h=location.hash.slice(1);if(V[h])S.screen=h;
render();
</script>
